# ==============================================================================
# PANTALLAS OLED (SSD1306 128x32 I2C) Y WIDGETS DE ESTADO
# ==============================================================================
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Widgets nativos: Capa activa, Estado de salida (USB/BLE + Perfil 0-4) y Conexión
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# ==============================================================================
# ALIMENTACIÓN EXTERNA Y GESTIÓN DE ENERGÍA PARA POWER BANK
# ==============================================================================
CONFIG_ZMK_EXT_POWER=y

# Tiempo de inactividad antes de entrar en estado IDLE (60,000 ms = 1 minuto)
CONFIG_ZMK_IDLE_TIMEOUT=60000

# Desactivar el modo Deep Sleep: evita que el consumo caiga a microamperios y que
# la power bank apague su puerto USB por detección de "carga desconectada".
CONFIG_ZMK_SLEEP=n

# ==============================================================================
# SUBSISTEMA RGB (WS2812B - 27 LEDs POR MITAD / 54 TOTALES)
# ==============================================================================
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Vincula el estado del bus de energía externa con la tira RGB
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

# Apagado automático de LEDs al entrar en reposo para evitar sobreconsumo
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Mantener RGB operativo mientras recibe energía por USB desde la power bank
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# Estado inicial predeterminado de fábrica
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30

# Límite de seguridad de brillo al 60% para proteger el regulador de 3.3V del nice!nano v2
# alimentando 27 LEDs WS2812B simultáneos por mitad
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# ==============================================================================
# BLUETOOTH LOW ENERGY (BLE) Y PERFILES MÚLTIPLES
# ==============================================================================
# Potencia de antena al máximo (+8 dBm) para enlace split sin interferencias
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Soporte para 5 conexiones y 5 vínculos (Nota técnica: en arquitecturas split de ZMK,
# 1 canal se reserva para enlazar la mitad periférica derecha; si deseas usar los 5
# perfiles de host simultáneamente además del enlace entre mitades, puedes subirlo a 6)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# Estabilidad adicional de enlace BLE en entornos saturados de 2.4 GHz
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y