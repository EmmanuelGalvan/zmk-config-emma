# ==============================================================================
# PANTALLAS OLED SSD1306 (128x32 I2C)
# ==============================================================================
# Habilita el subsistema de pantalla. ZMK seleccionará automáticamente
# la pantalla de estado personalizada (128x32) del escudo Corne.
CONFIG_ZMK_DISPLAY=y

# ==============================================================================
# GESTIÓN DE ENERGÍA CONTINUA (POWER BANK)
# ==============================================================================
CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_SLEEP=n

# ==============================================================================
# RETROILUMINACIÓN RGB (WS2812B - 27 LEDs POR MITAD)
# ==============================================================================
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60

# ==============================================================================
# BLUETOOTH LOW ENERGY (BLE)
# ==============================================================================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y